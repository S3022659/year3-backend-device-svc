# week9 https://github.com/S3022659/cis3039-example-cicd-app

name: Build and Deploy to Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (into ./dist)
        run: npm run build

      - name: Publish function app to package folder
        run: |
          # make an empty package folder
          rm -rf package
          mkdir package

          # copy root metadata
          cp host.json package/
          cp package.json package/
          cp package-lock.json package/

          # copy compiled JS
          cp -r dist package/dist

          # install runtime dependencies only (no devDeps) into the package
          npm ci --omit=dev --prefix package

      - name: Save package temporarily for deployment
        uses: actions/upload-artifact@v4
        with:
          name: functionapp-package
          path: package
          retention-days: 1

  deploy-to-test:
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Download package artefact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-package
          path: package

      - name: Zip package
        run: |
          cd package
          zip -r ../package.zip .
          cd ..

      - name: Deploy to Azure Function App via Kudu API
        run: |
          curl -X POST \
            https://ica-function-jc76.scm.azurewebsites.net/api/zipdeploy \
            --data-binary @package.zip \
            -H "Content-Type: application/octet-stream" \
            --user "${{ secrets.AZURE_PUBLISH_USERNAME }}:${{ secrets.AZURE_PUBLISH_PASSWORD }}"
